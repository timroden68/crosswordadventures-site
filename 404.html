<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found: Crossword Adventures</title>
<script>
// GitHub Pages addresses are case-sensitive and parents type the printed address by hand, so send common
// variants of a book's address (AdventuresOne, adventures-one, adventures1, book1 ...) to the right page.
(function () {
  var BOOKS = { adventuresone: ["adventuresone", "adventures1", "crosswordadventuresone", "crosswordadventures1", "book1", "one"] };
  var key = location.pathname.toLowerCase().replace(/index\.html?$/, "").replace(/[^a-z0-9]/g, "");
  for (var slug in BOOKS) {
    if (BOOKS[slug].indexOf(key) >= 0) { location.replace("/" + slug + "/"); return; }
  }
})();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Luckiest+Guy&display=swap">

</head>

     <a href="/adventuresone/">crosswordadventures.com/adventuresone</a>.</p>
  <p><a href="/">Go to the home page</a></p>
</main>
</body>
</html>
